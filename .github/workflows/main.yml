        cat > app/src/main/java/com/translator/serbia/MessageModel.kt << 'EOF'
        package com.translator.serbia

        data class MessageModel(
            val sender: String,
            val originalText: String,
            val translatedText: String,
            val time: String,
            val isFromSerb: Boolean
        )
        EOF

        cat > app/src/main/java/com/translator/serbia/MessageAdapter.kt << 'EOF'
        package com.translator.serbia

        import android.graphics.Color
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView

        class MessageAdapter(private val messages: MutableList<MessageModel>) :
            RecyclerView.Adapter<MessageAdapter.ViewHolder>() {

            class ViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                val cardLayout: View = view.findViewById(R.id.cardLayout)
                val tvSender: TextView = view.findViewById(R.id.tvSender)
                val tvTime: TextView = view.findViewById(R.id.tvTime)
                val tvOriginal: TextView = view.findViewById(R.id.tvOriginal)
                val tvTranslated: TextView = view.findViewById(R.id.tvTranslated)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                val view = LayoutInflater.from(parent.context).inflate(R.layout.item_message, parent, false)
                return ViewHolder(view)
            }

            override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                val item = messages[position]
                holder.tvSender.text = item.sender
                holder.tvTime.text = item.time
                holder.tvOriginal.text = "Оригинал: ${item.originalText}"
                holder.tvTranslated.text = "Перевод: ${item.translatedText}"

                if (item.isFromSerb) {
                    holder.cardLayout.setBackgroundColor(Color.parseColor("#E8F5E9"))
                    holder.tvSender.setTextColor(Color.parseColor("#2E7D32"))
                } else {
                    holder.cardLayout.setBackgroundColor(Color.parseColor("#E3F2FD"))
                    holder.tvSender.setTextColor(Color.parseColor("#1565C0"))
                }
            }

            override fun getItemCount() = messages.size

            fun addMessage(msg: MessageModel) {
                messages.add(msg)
                notifyItemInserted(messages.size - 1)
            }

            fun clearAll() {
                val count = messages.size
                messages.clear()
                notifyItemRangeRemoved(0, count)
            }

            fun getAllText(): String {
                val sb = StringBuilder()
                for (m in messages) {
                    sb.append("[${m.time}] ${m.sender}:\n")
                    sb.append("Оригинал: ${m.originalText}\n")
                    sb.append("Перевод: ${m.translatedText}\n\n")
                }
                return sb.toString()
            }
        }
        EOF

        cat > app/src/main/java/com/translator/serbia/MainActivity.kt << 'EOF'
        package com.translator.serbia

        import android.Manifest
        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.media.AudioAttributes
        import android.media.AudioDeviceInfo
        import android.media.AudioManager
        import android.os.Build
        import android.os.Bundle
        import android.os.Handler
        import android.os.Looper
        import android.speech.RecognitionListener
        import android.speech.RecognizerIntent
        import android.speech.SpeechRecognizer
        import android.speech.tts.TextToSpeech
        import android.speech.tts.UtteranceProgressListener
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import kotlinx.coroutines.CoroutineScope
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.launch
        import kotlinx.coroutines.withContext
        import org.json.JSONArray
        import java.net.HttpURLConnection
        import java.net.URL
        import java.net.URLEncoder
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale

        class MainActivity : AppCompatActivity() {

            private lateinit var tvStatus: TextView
            private lateinit var rvMessages: RecyclerView
            private lateinit var btnAutoSpeak: Button
            private lateinit var btnToggleAuto: Button
            private lateinit var btnCopy: Button
            private lateinit var btnClear: Button

            private lateinit var adapter: MessageAdapter
            private val messagesList = mutableListOf<MessageModel>()

            private var speechRecognizer: SpeechRecognizer? = null
            private var tts: TextToSpeech? = null
            private var isTtsReady = false

            private var isContinuousListening = false
            private var isCurrentlySpeaking = false
            private val mainHandler = Handler(Looper.getMainLooper())

            private val REQUEST_PERMISSIONS = 101

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                tvStatus = findViewById(R.id.tvStatus)
                rvMessages = findViewById(R.id.rvMessages)
                btnAutoSpeak = findViewById(R.id.btnAutoSpeak)
                btnToggleAuto = findViewById(R.id.btnToggleAuto)
                btnCopy = findViewById(R.id.btnCopy)
                btnClear = findViewById(R.id.btnClear)

                adapter = MessageAdapter(messagesList)
                rvMessages.layoutManager = LinearLayoutManager(this).apply {
                    stackFromEnd = true
                }
                rvMessages.adapter = adapter

                checkPermissions()
                initTTS()
                initSpeechRecognizer()

                btnAutoSpeak.setOnClickListener {
                    if (isContinuousListening) {
                        stopContinuousListening()
                    }
                    startListeningOnce()
                }

                btnToggleAuto.setOnClickListener {
                    if (isContinuousListening) {
                        stopContinuousListening()
                    } else {
                        startContinuousListening()
                    }
                }

                btnCopy.setOnClickListener {
                    val fullText = adapter.getAllText()
                    if (fullText.isNotEmpty()) {
                        val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                        val clip = ClipData.newPlainText("Диалог", fullText)
                        clipboard.setPrimaryClip(clip)
                        Toast.makeText(this, "Диалог скопирован!", Toast.LENGTH_SHORT).show()
                    } else {
                        Toast.makeText(this, "История диалога пуста", Toast.LENGTH_SHORT).show()
                    }
                }

                btnClear.setOnClickListener {
                    adapter.clearAll()
                    tvStatus.text = "История очищена."
                }
            }

            private fun checkPermissions() {
                val needed = mutableListOf<String>()
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    needed.add(Manifest.permission.RECORD_AUDIO)
                }
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                        needed.add(Manifest.permission.BLUETOOTH_CONNECT)
                    }
                }
                if (needed.isNotEmpty()) {
                    ActivityCompat.requestPermissions(this, needed.toTypedArray(), REQUEST_PERMISSIONS)
                }
            }

            private fun initTTS() {
                tts = TextToSpeech(this) { status ->
                    if (status == TextToSpeech.SUCCESS) {
                        isTtsReady = true
                    }
                }

                tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                    override fun onStart(utteranceId: String?) {
                        isCurrentlySpeaking = true
                    }
                    override fun onDone(utteranceId: String?) {
                        isCurrentlySpeaking = false
                        runOnUiThread {
                            resetAudioRouting()
                            if (isContinuousListening) {
                                tvStatus.text = "Слушаю..."
                                mainHandler.postDelayed({ restartListeningIfNeeded() }, 400)
                            } else {
                                tvStatus.text = "Готов к следующей фразе."
                            }
                        }
                    }
                    override fun onError(utteranceId: String?) {
                        isCurrentlySpeaking = false
                        runOnUiThread {
                            resetAudioRouting()
                            if (isContinuousListening) {
                                mainHandler.postDelayed({ restartListeningIfNeeded() }, 400)
                            }
                        }
                    }
                })
            }

            private fun initSpeechRecognizer() {
                if (SpeechRecognizer.isRecognitionAvailable(this)) {
                    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                    speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                        override fun onReadyForSpeech(params: Bundle?) {
                            if (!isCurrentlySpeaking) {
                                tvStatus.text = if (isContinuousListening) "🎙️ СЛУШАЮ (свободные руки)..." else "🎙️ Слушаю речь..."
                            }
                        }
                        override fun onBeginningOfSpeech() {
                            tvStatus.text = "Запись речи..."
                        }
                        override fun onRmsChanged(rmsdB: Float) {}
                        override fun onBufferReceived(buffer: ByteArray?) {}
                        override fun onEndOfSpeech() {
                            tvStatus.text = "Обработка..."
                        }
                        override fun onError(error: Int) {
                            if (isContinuousListening && !isCurrentlySpeaking) {
                                mainHandler.postDelayed({ restartListeningIfNeeded() }, 500)
                            } else {
                                tvStatus.text = "Пауза. Нажмите для записи."
                            }
                        }
                        override fun onResults(results: Bundle?) {
                            val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                            val recognized = matches?.firstOrNull() ?: ""
                            if (recognized.isNotBlank()) {
                                handleRecognizedPhrase(recognized)
                            } else {
                                if (isContinuousListening && !isCurrentlySpeaking) {
                                    mainHandler.postDelayed({ restartListeningIfNeeded() }, 400)
                                }
                            }
                        }
                        override fun onPartialResults(partialResults: Bundle?) {}
                        override fun onEvent(eventType: Int, params: Bundle?) {}
                    })
                }
            }

            private fun startContinuousListening() {
                isContinuousListening = true
                btnToggleAuto.text = "🛑 РЕЖИМ «СВОБОДНЫЕ РУКИ»: ВКЛ"
                tvStatus.text = "Режим включен. Говорите «Переведи ... всё»"
                restartListeningIfNeeded()
            }

            private fun stopContinuousListening() {
                isContinuousListening = false
                btnToggleAuto.text = "🎙️ РЕЖИМ «СВОБОДНЫЕ РУКИ»: ВЫКЛ"
                tvStatus.text = "Режим выключен."
                try {
                    speechRecognizer?.stopListening()
                } catch (e: Exception) {}
            }

            private fun restartListeningIfNeeded() {
                if (!isContinuousListening || isCurrentlySpeaking) return
                startListeningOnce()
            }

            private fun startListeningOnce() {
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    checkPermissions()
                    return
                }

                val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ru-RU")
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "ru-RU")
                    putStringArrayListExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", arrayListOf("sr-RS", "ru-RU"))
                }

                try {
                    speechRecognizer?.startListening(intent)
                } catch (e: Exception) {
                    tvStatus.text = "Ошибка микрофона: ${e.message}"
                }
            }

            private fun handleRecognizedPhrase(rawText: String) {
                var text = rawText.trim()
                var isExplicitRussian = false

                val lower = text.lowercase(Locale.getDefault())
                if (lower.startsWith("переведи") || lower.startsWith("перевести") || lower.startsWith("преведи")) {
                    isExplicitRussian = true
                    text = text.replaceFirst(Regex("^(переведи|перевести|преведи)\\s*", RegexOption.IGNORE_CASE), "")
                }

                if (text.lowercase(Locale.getDefault()).endsWith("всё") || text.lowercase(Locale.getDefault()).endsWith("все")) {
                    isExplicitRussian = true
                    text = text.replace(Regex("\\s*(всё|все)$", RegexOption.IGNORE_CASE), "")
                }

                text = text.trim()
                if (text.isBlank()) {
                    if (isContinuousListening) restartListeningIfNeeded()
                    return
                }

                CoroutineScope(Dispatchers.Main).launch {
                    tvStatus.text = "Анализирую и перевожу..."
                    val (detectedLang, translatedText) = autoTranslate(text, isExplicitRussian)

                    val time = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                    val isFromMe = (detectedLang == "ru")

                    val sender = if (isFromMe) "Вы" else "Серб"
                    val msg = MessageModel(
                        sender = sender,
                        originalText = text,
                        translatedText = translatedText,
                        time = time,
                        isFromSerb = !isFromMe
                    )
                    adapter.addMessage(msg)
                    rvMessages.smoothScrollToPosition(adapter.itemCount - 1)

                    if (isFromMe) {
                        tvStatus.text = "Озвучиваю сербу в динамик..."
                        playAudioToSpeaker(translatedText, "sr")
                    } else {
                        tvStatus.text = "Перевод вам в наушник..."
                        playAudioToEarphone(translatedText, "ru")
                    }
                }
            }

            private suspend fun autoTranslate(text: String, isExplicitRussian: Boolean): Pair<String, String> = withContext(Dispatchers.IO) {
                try {
                    if (isExplicitRussian) {
                        val tr = translateQuery(text, "ru", "sr")
                        return@withContext Pair("ru", tr.second)
                    }

                    val first = translateQuery(text, "auto", "sr")
                    val detected = first.first

                    if (detected == "ru") {
                        Pair("ru", first.second)
                    } else {
                        val second = translateQuery(text, "sr", "ru")
                        Pair("sr", second.second)
                    }
                } catch (e: Exception) {
                    Pair("ru", "Ошибка: ${e.message}")
                }
            }

            private fun translateQuery(text: String, sl: String, tl: String): Pair<String, String> {
                val encoded = URLEncoder.encode(text, "UTF-8")
                val urlString = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=$sl&tl=$tl&dt=t&q=$encoded"
                val conn = URL(urlString).openConnection() as HttpURLConnection
                conn.requestMethod = "GET"
                conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                conn.connectTimeout = 6000
                conn.readTimeout = 6000

                val resp = conn.inputStream.bufferedReader().use { it.readText() }
                val root = JSONArray(resp)
                val sentences = root.getJSONArray(0)
                val sb = StringBuilder()
                for (i in 0 until sentences.length()) {
                    val row = sentences.optJSONArray(i)
                    if (row != null && row.length() > 0) {
                        val part = row.optString(0)
                        if (part != null) sb.append(part)
                    }
                }

                val detected = root.optString(2, "sr")
                return Pair(detected, sb.toString())
            }

            private fun playAudioToSpeaker(text: String, lang: String) {
                if (!isTtsReady) return
                val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                audioManager.mode = AudioManager.MODE_IN_COMMUNICATION
                audioManager.isSpeakerphoneOn = true

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    val speaker = audioManager.availableCommunicationDevices.firstOrNull {
                        it.type == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER
                    }
                    if (speaker != null) {
                        audioManager.setCommunicationDevice(speaker)
                    }
                }

                val audioAttributes = AudioAttributes.Builder()
                    .setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)
                    .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                    .build()
                tts?.setAudioAttributes(audioAttributes)

                val params = Bundle().apply {
                    putInt("streamType", AudioManager.STREAM_VOICE_CALL)
                }

                tts?.language = Locale(lang, if (lang == "sr") "RS" else "RU")
                tts?.speak(text, TextToSpeech.QUEUE_FLUSH, params, "UTTERANCE_SPEAKER")
            }

            private fun playAudioToEarphone(text: String, lang: String) {
                if (!isTtsReady) return
                val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                audioManager.isSpeakerphoneOn = false

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    val headset = audioManager.availableCommunicationDevices.firstOrNull {
                        it.type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                        it.type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP ||
                        it.type == AudioDeviceInfo.TYPE_BLE_HEADSET ||
                        it.type == AudioDeviceInfo.TYPE_WIRED_HEADSET ||
                        it.type == AudioDeviceInfo.TYPE_WIRED_HEADPHONES
                    }
                    if (headset != null) {
                        audioManager.mode = AudioManager.MODE_IN_COMMUNICATION
                        audioManager.setCommunicationDevice(headset)
                    } else {
                        audioManager.clearCommunicationDevice()
                        audioManager.mode = AudioManager.MODE_NORMAL
                    }
                } else {
                    audioManager.mode = AudioManager.MODE_NORMAL
                }

                val audioAttributes = AudioAttributes.Builder()
                    .setUsage(AudioAttributes.USAGE_MEDIA)
                    .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                    .build()
                tts?.setAudioAttributes(audioAttributes)

                tts?.language = Locale(lang, if (lang == "sr") "RS" else "RU")
                tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "UTTERANCE_EARPHONE")
            }

            private fun resetAudioRouting() {
                val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    audioManager.clearCommunicationDevice()
                }
                audioManager.isSpeakerphoneOn = false
                audioManager.mode = AudioManager.MODE_NORMAL
            }

            override fun onDestroy() {
                stopContinuousListening()
                speechRecognizer?.destroy()
                tts?.stop()
                tts?.shutdown()
                resetAudioRouting()
                super.onDestroy()
            }
        }
        EOF

    - name: Build APK with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceTranslator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
