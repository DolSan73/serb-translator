            private fun showDictionaryDialog() {
                vibrateShort()
                val dialog = Dialog(this)
                dialog.setTitle("Словарь дня")

                val root = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setPadding(24, 24, 24, 24)
                    setBackgroundColor(android.graphics.Color.WHITE)
                }

                val tvTitle = TextView(this).apply {
                    text = "📖 Словарь дня (нажмите для озвучки):"
                    textSize = 16f
                    setTypeface(null, android.graphics.Typeface.BOLD)
                    setTextColor(android.graphics.Color.parseColor("#212121"))
                    setPadding(0, 0, 0, 16)
                }
                root.addView(tvTitle)

                val scrollView = ScrollView(this).apply {
                    layoutParams = LinearLayout.LayoutParams(
                        ViewGroup.LayoutParams.MATCH_PARENT,
                        800
                    )
                }
                val listLayout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                }

                val all = adapter.getAllMessages()
                if (all.isEmpty()) {
                    val tvEmpty = TextView(this).apply {
                        text = "Диалог пуст. Новые слова появятся здесь после разговоров."
                        textSize = 14f
                        setTextColor(android.graphics.Color.GRAY)
                    }
                    listLayout.addView(tvEmpty)
                } else {
                    for (m in all) {
                        val serb = if (m.isFromSerb) m.originalText else m.translatedText
                        val ru = if (m.isFromSerb) m.translatedText else m.originalText

                        val itemBtn = Button(this).apply {
                            text = "🇷🇸 $serb\n🇷🇺 $ru"
                            textSize = 13f
                            gravity = Gravity.START
                            setBackgroundColor(android.graphics.Color.parseColor("#ECEFF1"))
                            setTextColor(android.graphics.Color.parseColor("#263238"))
                            setPadding(16, 12, 16, 12)
                            val params = LinearLayout.LayoutParams(
                                ViewGroup.LayoutParams.MATCH_PARENT,
                                ViewGroup.LayoutParams.WRAP_CONTENT
                            ).apply { setMargins(0, 4, 0, 4) }
                            layoutParams = params

                            setOnClickListener {
                                vibrateShort()
                                playAudioToSpeaker(serb, "sr")
                            }
                        }
                        listLayout.addView(itemBtn)
                    }
                }

                scrollView.addView(listLayout)
                root.addView(scrollView)

                val btnClose = Button(this).apply {
                    text = "Закрыть"
                    setBackgroundColor(android.graphics.Color.parseColor("#455A64"))
