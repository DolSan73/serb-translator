name: Build Voice Translator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Unpack Android Project
      run: |
        echo "" | base64 -d | tar -xz

    - name: Commit Source Files to Repo
      continue-on-error: true
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add settings.gradle gradle.properties build.gradle app/
        git commit -m "Auto-generate source code files" || echo "Nothing to commit"
        git push || echo "Git push skipped"

    - name: Build APK with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceTranslator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
        
