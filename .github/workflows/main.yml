                    R.id.qp5 to Pair("Ещё раз", "Још једном, молим те"),
                    R.id.qp6 to Pair("Спасибо", "Хвала пуно"),
                    R.id.qp7 to Pair("Подожди минуту", "Сачекај минут"),
                    R.id.qp8 to Pair("Где чертёж?", "Где је нацрт?")
                )

                for ((btnId, pair) in qpMap) {
                    findViewById<Button>(btnId)?.setOnClickListener {
