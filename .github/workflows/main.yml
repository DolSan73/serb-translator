name: Build Voice Translator APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5
        cache-read-only: false

    - name: Generate Android Project Files
      run: |
        mkdir -p app/src/main/java/com/translator/serbia
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        cat > settings.gradle << 'EOF'
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SerbVoiceTranslator"
        include ':app'
        EOF

        cat > build.gradle << 'EOF'
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
        android.useAndroidX=true
        android.nonTransitiveRClass=true
        EOF

        cat > app/build.gradle << 'EOF'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.translator.serbia'
            compileSdk 34

            defaultConfig {
                applicationId "com.translator.serbia"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
            buildFeatures {
                viewBinding true
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
            implementation 'androidx.recyclerview:recyclerview:1.3.2'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        }
        EOF

        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.RECORD_AUDIO" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
            <uses-permission android:name="android.permission.BLUETOOTH" />
            <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_btn_speak_now"
                android:label="Переводчик Сербия"
                android:roundIcon="@android:drawable/ic_btn_speak_now"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true"
                    android:windowSoftInputMode="adjustResize">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        cat > app/src/main/res/values/strings.xml << 'EOF'
        <resources>
            <string name="app_name">Переводчик Сербия</string>
        </resources>
        EOF

        cat > app/src/main/res/layout/activity_main.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:background="#F0F2F5">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:padding="12dp"
                android:background="#FFFFFF"
                android:elevation="4dp"
                android:gravity="center_vertical">

                <TextView
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:text="Переводчик Сербия"
                    android:textSize="18sp"
                    android:textStyle="bold"
                    android:textColor="#212121" />

                <Button
                    android:id="@+id/btnCopy"
                    android:layout_width="wrap_content"
                    android:layout_height="40dp"
                    android:text="Копировать"
                    android:textSize="12sp"
                    android:layout_marginEnd="6dp" />

                <Button
                    android:id="@+id/btnClear"
                    android:layout_width="wrap_content"
                    android:layout_height="40dp"
                    android:text="Очистить"
                    android:textSize="12sp" />
            </LinearLayout>

            <TextView
                android:id="@+id/tvStatus"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:padding="10dp"
                android:gravity="center"
                android:text="Готов к работе. Подключите наушник и нажмите кнопку."
                android:textSize="14sp"
                android:textColor="#424242"
                android:background="#E0E0E0" />

            <androidx.recyclerview.widget.RecyclerView
                android:id="@+id/rvMessages"
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1"
                android:padding="8dp"
                android:clipToPadding="false" />

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:padding="10dp"
                android:background="#FFFFFF"
                android:elevation="8dp">

                <Button
                    android:id="@+id/btnSerbSpeak"
                    android:layout_width="0dp"
                    android:layout_height="76dp"
                    android:layout_weight="1"
                    android:layout_marginEnd="6dp"
                    android:backgroundTint="#2E7D32"
                    android:text="СЕРБ ГОВОРИТ&#10;(в наушник)"
                    android:textSize="14sp"
                    android:textStyle="bold"
                    android:textColor="#FFFFFF" />

                <Button
                    android:id="@+id/btnMeSpeak"
                    android:layout_width="0dp"
                    android:layout_height="76dp"
                    android:layout_weight="1"
                    android:layout_marginStart="6dp"
                    android:backgroundTint="#1565C0"
                    android:text="Я ГОВОРЮ&#10;(в динамик)"
                    android:textSize="14sp"
                    android:textStyle="bold"
                    android:textColor="#FFFFFF" />
            </LinearLayout>

        </LinearLayout>
        EOF

        cat > app/src/main/res/layout/item_message.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/cardLayout"
            android:layout_width="match_parent"
            android:layout_height="wrap_content"
            android:orientation="vertical"
            android:padding="12dp"
            android:layout_marginBottom="8dp"
            android:background="#FFFFFF"
            android:elevation="2dp">

            <LinearLayout
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:gravity="center_vertical">

                <TextView
                    android:id="@+id/tvSender"
                    android:layout_width="0dp"
                    android:layout_height="wrap_content"
                    android:layout_weight="1"
                    android:textStyle="bold"
                    android:textSize="14sp"
                    android:textColor="#333333" />

                <TextView
                    android:id="@+id/tvTime"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:textSize="12sp"
                    android:textColor="#888888" />
            </LinearLayout>

            <TextView
                android:id="@+id/tvOriginal"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="4dp"
                android:textSize="15sp"
                android:textColor="#616161" />

            <TextView
                android:id="@+id/tvTranslated"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="4dp"
                android:textSize="16sp"
                android:textStyle="bold"
                android:textColor="#111111" />
        </LinearLayout>
        EOF

        cat > app/src/main/java/com/translator/serbia/MessageModel.kt << 'EOF'
        package com.translator.serbia

        data class MessageModel(
            val sender: String,
            val originalText: String,
            val translatedText: String,
            val time: String,
            val isFromSerb: Boolean
        )
        EOF

        cat > app/src/main/java/com/translator/serbia/MessageAdapter.kt << 'EOF'
        package com.translator.serbia

        import android.graphics.Color
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView

        class MessageAdapter(private val messages: MutableList<MessageModel>) :
            RecyclerView.Adapter<MessageAdapter.ViewHolder>() {

            class ViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                val cardLayout: View = view.findViewById(R.id.cardLayout)
                val tvSender: TextView = view.findViewById(R.id.tvSender)
                val tvTime: TextView = view.findViewById(R.id.tvTime)
                val tvOriginal: TextView = view.findViewById(R.id.tvOriginal)
                val tvTranslated: TextView = view.findViewById(R.id.tvTranslated)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                val view = LayoutInflater.from(parent.context).inflate(R.layout.item_message, parent, false)
                return ViewHolder(view)
            }

            override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                val item = messages[position]
                holder.tvSender.text = item.sender
                holder.tvTime.text = item.time
                holder.tvOriginal.text = "Оригинал: ${item.originalText}"
                holder.tvTranslated.text = "Перевод: ${item.translatedText}"

                if (item.isFromSerb) {
                    holder.cardLayout.setBackgroundColor(Color.parseColor("#E8F5E9"))
                    holder.tvSender.setTextColor(Color.parseColor("#2E7D32"))
                } else {
                    holder.cardLayout.setBackgroundColor(Color.parseColor("#E3F2FD"))
                    holder.tvSender.setTextColor(Color.parseColor("#1565C0"))
                }
            }

            override fun getItemCount() = messages.size

            fun addMessage(msg: MessageModel) {
                messages.add(msg)
                notifyItemInserted(messages.size - 1)
            }

            fun clearAll() {
                val count = messages.size
                messages.clear()
                notifyItemRangeRemoved(0, count)
            }

            fun getAllText(): String {
                val sb = StringBuilder()
                for (m in messages) {
                    sb.append("[${m.time}] ${m.sender}:\n")
                    sb.append("Оригинал: ${m.originalText}\n")
                    sb.append("Перевод: ${m.translatedText}\n\n")
                }
                return sb.toString()
            }
        }
        EOF

        cat > app/src/main/java/com/translator/serbia/MainActivity.kt << 'EOF'
        package com.translator.serbia

        import android.Manifest
        import android.content.ClipData
        import android.content.ClipboardManager
        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.media.AudioDeviceInfo
        import android.media.AudioManager
        import android.os.Build
        import android.os.Bundle
        import android.speech.RecognitionListener
        import android.speech.RecognizerIntent
        import android.speech.SpeechRecognizer
        import android.speech.tts.TextToSpeech
        import android.speech.tts.UtteranceProgressListener
        import android.widget.Button
        import android.widget.TextView
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import androidx.core.app.ActivityCompat
        import androidx.core.content.ContextCompat
        import androidx.recyclerview.widget.LinearLayoutManager
        import androidx.recyclerview.widget.RecyclerView
        import kotlinx.coroutines.CoroutineScope
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.launch
        import kotlinx.coroutines.withContext
        import org.json.JSONArray
        import java.net.HttpURLConnection
        import java.net.URL
        import java.net.URLEncoder
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale

        class MainActivity : AppCompatActivity() {

            private lateinit var tvStatus: TextView
            private lateinit var rvMessages: RecyclerView
            private lateinit var btnSerbSpeak: Button
            private lateinit var btnMeSpeak: Button
            private lateinit var btnCopy: Button
            private lateinit var btnClear: Button

            private lateinit var adapter: MessageAdapter
            private val messagesList = mutableListOf<MessageModel>()

            private var speechRecognizer: SpeechRecognizer? = null
            private var tts: TextToSpeech? = null
            private var isTtsReady = false

            private var currentModeIsSerb = false

            private val REQUEST_PERMISSIONS = 101

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                tvStatus = findViewById(R.id.tvStatus)
                rvMessages = findViewById(R.id.rvMessages)
                btnSerbSpeak = findViewById(R.id.btnSerbSpeak)
                btnMeSpeak = findViewById(R.id.btnMeSpeak)
                btnCopy = findViewById(R.id.btnCopy)
                btnClear = findViewById(R.id.btnClear)

                adapter = MessageAdapter(messagesList)
                rvMessages.layoutManager = LinearLayoutManager(this).apply {
                    stackFromEnd = true
                }
                rvMessages.adapter = adapter

                checkPermissions()
                initTTS()
                initSpeechRecognizer()

                btnSerbSpeak.setOnClickListener {
                    startListeningSession(isSerb = true)
                }

                btnMeSpeak.setOnClickListener {
                    startListeningSession(isSerb = false)
                }

                btnCopy.setOnClickListener {
                    val fullText = adapter.getAllText()
                    if (fullText.isNotEmpty()) {
                        val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                        val clip = ClipData.newPlainText("Диалог", fullText)
                        clipboard.setPrimaryClip(clip)
                        Toast.makeText(this, "Диалог скопирован в буфер обмена!", Toast.LENGTH_SHORT).show()
                    } else {
                        Toast.makeText(this, "История диалога пуста", Toast.LENGTH_SHORT).show()
                    }
                }

                btnClear.setOnClickListener {
                    adapter.clearAll()
                    tvStatus.text = "История очищена."
                }
            }

            private fun checkPermissions() {
                val needed = mutableListOf<String>()
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    needed.add(Manifest.permission.RECORD_AUDIO)
                }
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                        needed.add(Manifest.permission.BLUETOOTH_CONNECT)
                    }
                }
                if (needed.isNotEmpty()) {
                    ActivityCompat.requestPermissions(this, needed.toTypedArray(), REQUEST_PERMISSIONS)
                }
            }

            private fun initTTS() {
                tts = TextToSpeech(this) { status ->
                    if (status == TextToSpeech.SUCCESS) {
                        isTtsReady = true
                    }
                }

                tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                    override fun onStart(utteranceId: String?) {}
                    override fun onDone(utteranceId: String?) {
                        runOnUiThread {
                            resetAudioRouting()
                            tvStatus.text = "Готов к следующей реплике."
                        }
                    }
                    override fun onError(utteranceId: String?) {
                        runOnUiThread {
                            resetAudioRouting()
                        }
                    }
                })
            }

            private fun initSpeechRecognizer() {
                if (SpeechRecognizer.isRecognitionAvailable(this)) {
                    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                    speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                        override fun onReadyForSpeech(params: Bundle?) {
                            tvStatus.text = if (currentModeIsSerb) "Слушаю сербскую речь..." else "Слушаю русскую речь..."
                        }
                        override fun onBeginningOfSpeech() {
                            tvStatus.text = "Запись речи..."
                        }
                        override fun onRmsChanged(rmsdB: Float) {}
                        override fun onBufferReceived(buffer: ByteArray?) {}
                        override fun onEndOfSpeech() {
                            tvStatus.text = "Обработка и перевод..."
                        }
                        override fun onError(error: Int) {
                            tvStatus.text = "Ошибка записи ($error). Попробуйте еще раз."
                        }
                        override fun onResults(results: Bundle?) {
                            val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                            val recognized = matches?.firstOrNull() ?: ""
                            if (recognized.isNotBlank()) {
                                handleRecognitionResult(recognized, currentModeIsSerb)
                            } else {
                                tvStatus.text = "Речь не распознана. Попробуйте еще раз."
                            }
                        }
                        override fun onPartialResults(partialResults: Bundle?) {}
                        override fun onEvent(eventType: Int, params: Bundle?) {}
                    })
                } else {
                    Toast.makeText(this, "Распознавание речи недоступно на устройстве", Toast.LENGTH_LONG).show()
                }
            }

            private fun startListeningSession(isSerb: Boolean) {
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    checkPermissions()
                    return
                }

                currentModeIsSerb = isSerb
                val langCode = if (isSerb) "sr-RS" else "ru-RU"

                val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE, langCode)
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, langCode)
                    putExtra(RecognizerIntent.EXTRA_ONLY_RETURN_LANGUAGE_PREFERENCE, langCode)
                }

                try {
                    speechRecognizer?.startListening(intent)
                } catch (e: Exception) {
                    tvStatus.text = "Ошибка запуска микрофона: ${e.message}"
                }
            }

            private fun handleRecognitionResult(text: String, fromSerb: Boolean) {
                val fromLang = if (fromSerb) "sr" else "ru"
                val toLang = if (fromSerb) "ru" else "sr"

                CoroutineScope(Dispatchers.Main).launch {
                    tvStatus.text = "Перевожу..."
                    val translated = translateText(text, fromLang, toLang)

                    val time = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                    val sender = if (fromSerb) "Серб" else "Вы"

                    val msg = MessageModel(
                        sender = sender,
                        originalText = text,
                        translatedText = translated,
                        time = time,
                        isFromSerb = fromSerb
                    )
                    adapter.addMessage(msg)
                    rvMessages.smoothScrollToPosition(adapter.itemCount - 1)

                    if (fromSerb) {
                        tvStatus.text = "Воспроизведение перевода в наушник..."
                        playAudioToEarphone(translated, "ru")
                    } else {
                        tvStatus.text = "Озвучивание в динамик телефона..."
                        playAudioToSpeaker(translated, "sr")
                    }
                }
            }

            private suspend fun translateText(text: String, from: String, to: String): String = withContext(Dispatchers.IO) {
                try {
                    val encoded = URLEncoder.encode(text, "UTF-8")
                    val url = URL("https://translate.googleapis.com/translate_a/single?client=gtx&sl=$from&tl=$to&dt=t&q=$encoded")
                    val conn = url.openConnection() as HttpURLConnection
                    conn.requestMethod = "GET"
                    conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                    conn.connectTimeout = 6000
                    conn.readTimeout = 6000

                    val response = conn.inputStream.bufferedReader().use { it.readText() }
                    val root = JSONArray(response)
                    val sentences = root.getJSONArray(0)
                    val sb = StringBuilder()
                    for (i in 0 until sentences.length()) {
                        val row = sentences.optJSONArray(i)
                        if (row != null && row.length() > 0) {
                            val part = row.optString(0)
                            if (part != null) sb.append(part)
                        }
                    }
                    sb.toString()
                } catch (e: Exception) {
                    "Ошибка перевода: ${e.message}"
                }
            }

            private fun playAudioToSpeaker(text: String, lang: String) {
                if (!isTtsReady) return
                val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    val speaker = audioManager.availableCommunicationDevices.firstOrNull {
                        it.type == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER
                    }
                    if (speaker != null) {
                        audioManager.setCommunicationDevice(speaker)
                    }
                } else {
                    audioManager.mode = AudioManager.MODE_IN_COMMUNICATION
                    audioManager.isSpeakerphoneOn = true
                }

                tts?.language = Locale(lang, if (lang == "sr") "RS" else "RU")
                tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "UTTERANCE_SPEAKER")
            }

            private fun playAudioToEarphone(text: String, lang: String) {
                if (!isTtsReady) return
                val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    val headset = audioManager.availableCommunicationDevices.firstOrNull {
                        it.type == AudioDeviceInfo.TYPE_BLUETOOTH_SCO ||
                        it.type == AudioDeviceInfo.TYPE_BLUETOOTH_A2DP ||
                        it.type == AudioDeviceInfo.TYPE_BLE_HEADSET ||
                        it.type == AudioDeviceInfo.TYPE_WIRED_HEADSET ||
                        it.type == AudioDeviceInfo.TYPE_WIRED_HEADPHONES
                    }
                    if (headset != null) {
                        audioManager.setCommunicationDevice(headset)
                    } else {
                        audioManager.clearCommunicationDevice()
                    }
                } else {
                    audioManager.isSpeakerphoneOn = false
                    audioManager.mode = AudioManager.MODE_NORMAL
                }

                tts?.language = Locale(lang, if (lang == "sr") "RS" else "RU")
                tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "UTTERANCE_EARPHONE")
            }

            private fun resetAudioRouting() {
                val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    audioManager.clearCommunicationDevice()
                } else {
                    audioManager.isSpeakerphoneOn = false
                    audioManager.mode = AudioManager.MODE_NORMAL
                }
            }

            override fun onDestroy() {
                speechRecognizer?.destroy()
                tts?.stop()
                tts?.shutdown()
                resetAudioRouting()
                super.onDestroy()
            }
        }
        EOF

    - name: Build APK with Gradle
      run: gradle assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VoiceTranslator-APK
        path: app/build/outputs/apk/debug/app-debug.apk
