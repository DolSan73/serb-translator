            private fun vibrateShort() {
                try {
                    val v = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        v.vibrate(VibrationEffect.createOneShot(50, VibrationEffect.DEFAULT_AMPLITUDE))
                    } else {
                        v.vibrate(50)
                    }
                } catch (e: Exception) {}
            }

            private fun vibrateSuccess() {
                try {
                    val v = getSystemService(Context.VIBRATOR_SERVICE) as Vibrator
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                        v.vibrate(VibrationEffect.createWaveform(longArrayOf(0, 40, 60, 40), -1))
                    } else {
                        v.vibrate(longArrayOf(0, 40, 60, 40), -1)
                    }
                } catch (e: Exception) {}
            }

            private fun initOfflineTranslators() {
                val ruOptions = TranslatorOptions.Builder()
                    .setSourceLanguage(TranslateLanguage.RUSSIAN)
                    .setTargetLanguage(TranslateLanguage.CROATIAN)
                    .build()
                ruToOfflineTranslator = Translation.getClient(ruOptions)

                val srOptions = TranslatorOptions.Builder()
                    .setSourceLanguage(TranslateLanguage.CROATIAN)
                    .setTargetLanguage(TranslateLanguage.RUSSIAN)
                    .build()
                offlineToRuTranslator = Translation.getClient(srOptions)
            }

            private fun downloadOfflineModels() {
                tvStatus.text = "⏳ Скачивание офлайн-моделей (~30 МБ)..."
                btnDownloadOffline.isEnabled = false
                val conditions = DownloadConditions.Builder().build()

                ruToOfflineTranslator.downloadModelIfNeeded(conditions)
                    .addOnSuccessListener {
                        offlineToRuTranslator.downloadModelIfNeeded(conditions)
                            .addOnSuccessListener {
                                btnDownloadOffline.text = "✓ Офлайн OK"
                                btnDownloadOffline.isEnabled = true
                                tvStatus.text = "Офлайн-модели готовы к работе!"
                                Toast.makeText(this, "Офлайн-модели готовы!", Toast.LENGTH_LONG).show()
                            }
                            .addOnFailureListener { e ->
                                btnDownloadOffline.isEnabled = true
                                tvStatus.text = "Ошибка: ${e.message}"
                            }
                    }
                    .addOnFailureListener { e ->
                        btnDownloadOffline.isEnabled = true
                        tvStatus.text = "Ошибка: ${e.message}"
                    }
            }

            override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                if (keyCode == KeyEvent.KEYCODE_HEADSETHOOK ||
                    keyCode == KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE ||
                    keyCode == KeyEvent.KEYCODE_MEDIA_PLAY ||
                    keyCode == KeyEvent.KEYCODE_MEDIA_PAUSE) {
                    if (isRecording) {
                        stopRecording()
                    } else {
                        startRecording()
                    }
                    return true
                }
                return super.onKeyDown(keyCode, event)
            }

            private fun checkPermissions() {
                val needed = mutableListOf<String>()
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    needed.add(Manifest.permission.RECORD_AUDIO)
                }
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    if (ContextCompat.checkSelfPermission(this, Manifest.permission.BLUETOOTH_CONNECT) != PackageManager.PERMISSION_GRANTED) {
                        needed.add(Manifest.permission.BLUETOOTH_CONNECT)
                    }
                }
                if (needed.isNotEmpty()) {
                    ActivityCompat.requestPermissions(this, needed.toTypedArray(), REQUEST_PERMISSIONS)
                }
            }

            private fun initTTS() {
                tts = TextToSpeech(this) { status ->
                    if (status == TextToSpeech.SUCCESS) {
                        isTtsReady = true
                    }
                }

                tts?.setOnUtteranceProgressListener(object : UtteranceProgressListener() {
                    override fun onStart(utteranceId: String?) {}
                    override fun onDone(utteranceId: String?) {
                        runOnUiThread {
                            resetAudioRouting()
                            if (cbAutoListen.isChecked) {
                                tvStatus.text = "Озвучено. Жду ответ..."
                                mainHandler.postDelayed({ startRecording() }, 600)
                            } else {
                                tvStatus.text = "Озвучено. Нажмите микрофон или кнопку для продолжения."
                            }
                        }
                    }
                    override fun onError(utteranceId: String?) {
                        runOnUiThread {
                            resetAudioRouting()
                        }
                    }
                })
            }

            private fun initSpeechRecognizer() {
                if (SpeechRecognizer.isRecognitionAvailable(this)) {
                    speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                    speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                        override fun onReadyForSpeech(params: Bundle?) {
                            tvStatus.text = "🎙️ Слушаю... Говорите фразы"
                        }
                        override fun onBeginningOfSpeech() {
                            tvStatus.text = "Запись речи..."
                        }
                        override fun onRmsChanged(rmsdB: Float) {}
                        override fun onBufferReceived(buffer: ByteArray?) {}
                        override fun onEndOfSpeech() {
                            tvStatus.text = "Пауза. Распознаю слова..."
                        }
                        override fun onError(error: Int) {
                            isRecording = false
                            btnMic.text = "🎙️"
                            tvStatus.text = "Пауза. Слова в поле можно отредактировать."
                        }
                        override fun onResults(results: Bundle?) {
                            isRecording = false
                            btnMic.text = "🎙️"
                            val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                            val recognized = matches?.firstOrNull() ?: ""
                            if (recognized.isNotBlank()) {
                                handleVoiceInput(recognized)
                            } else {
                                tvStatus.text = "Речь не распознана. Попробуйте еще раз."
                            }
                        }
                        override fun onPartialResults(partialResults: Bundle?) {
                            val matches = partialResults?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                            val partial = matches?.firstOrNull() ?: ""
                            if (partial.isNotBlank()) {
                                tvStatus.text = "Слышу: $partial"
                            }
                        }
                        override fun onEvent(eventType: Int, params: Bundle?) {}
                    })
                }
            }

            private fun startRecording() {
                if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                    checkPermissions()
                    return
                }

                vibrateShort()
                isRecording = true
                btnMic.text = "⏹️"
                tvStatus.text = "Включение микрофона..."

                val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE, "ru-RU")
                    putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "ru-RU")
                    putStringArrayListExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", arrayListOf("sr-RS", "ru-RU"))
                    putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true)
                }

                try {
                    speechRecognizer?.startListening(intent)
                } catch (e: Exception) {
                    isRecording = false
                    btnMic.text = "🎙️"
                    tvStatus.text = "Ошибка микрофона: ${e.message}"
                }
            }

            private fun stopRecording() {
                isRecording = false
                btnMic.text = "🎙️"
                tvStatus.text = "Микрофон остановлен."
                try {
                    speechRecognizer?.stopListening()
                } catch (e: Exception) {}
            }

            private fun handleVoiceInput(rawText: String) {
                val (cleanedText, toSpeaker, toEarphone) = parseVoiceCommands(rawText)

                val current = etInput.text.toString().trim()
                val fullText = if (current.isEmpty()) cleanedText else "$current $cleanedText"
                etInput.setText(fullText)
                etInput.setSelection(fullText.length)

                if (toSpeaker && fullText.isNotBlank()) {
                    tvStatus.text = "Команда «Переведи»! Озвучиваю сербу..."
                    executeTranslation(fullText, forceToSpeaker = true, forceToEarphone = false)
                } else if (toEarphone && fullText.isNotBlank()) {
                    tvStatus.text = "Команда «Преведи»! Озвучиваю в наушник..."
                    executeTranslation(fullText, forceToSpeaker = false, forceToEarphone = true)
                } else {
                    tvStatus.text = "Слова на экране. Скажите «переведи» или нажмите кнопку."
                }
            }

            private fun parseVoiceCommands(raw: String): Triple<String, Boolean, Boolean> {
                var text = raw.trim()
                var toSpeaker = false
                var toEarphone = false

                val serbStart = Regex("^(преведи|превести|превод|prevedi|prevesti|prevod)\\s+", RegexOption.IGNORE_CASE)
                val serbEnd = Regex("\\s+(преведи|превести|превод|prevedi|prevesti|prevod)$", RegexOption.IGNORE_CASE)

                if (serbStart.containsMatchIn(text)) {
                    toEarphone = true
                    text = text.replaceFirst(serbStart, "")
                } else if (serbEnd.containsMatchIn(text)) {
                    toEarphone = true
                    text = text.replace(serbEnd, "")
                }

                val ruStart = Regex("^(переведи|перевести|перевод)\\s+", RegexOption.IGNORE_CASE)
                val ruEnd = Regex("\\s+(переведи|перевести|перевод|всё|все)$", RegexOption.IGNORE_CASE)

                if (ruStart.containsMatchIn(text)) {
                    toSpeaker = true
                    text = text.replaceFirst(ruStart, "")
                } else if (ruEnd.containsMatchIn(text)) {
                    toSpeaker = true
                    text = text.replace(ruEnd, "")
                }

                return Triple(text.trim(), toSpeaker, toEarphone)
            }

            private fun processManualSend(forceToSpeaker: Boolean, forceToEarphone: Boolean) {
                val text = etInput.text.toString().trim()
                if (text.isEmpty()) {
                    Toast.makeText(this, "Поле текста пусто! Надиктуйте или введите слова.", Toast.LENGTH_SHORT).show()
                    return
                }
                executeTranslation(text, forceToSpeaker, forceToEarphone)
            }

            private fun executeTranslation(text: String, forceToSpeaker: Boolean, forceToEarphone: Boolean) {
                CoroutineScope(Dispatchers.Main).launch {
                    tvStatus.text = "Перевожу..."
                    val (detectedLang, translatedText) = autoTranslate(text, forceToSpeaker, forceToEarphone)

                    vibrateSuccess()
                    val time = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                    val isFromMe = (detectedLang == "ru")

                    val sender = if (isFromMe) "Вы" else "Серб"
                    val msg = MessageModel(
                        sender = sender,
                        originalText = text,
                        translatedText = translatedText,
                        time = time,
                        isFromSerb = !isFromMe
                    )
                    adapter.addMessage(msg)
                    rvMessages.smoothScrollToPosition(adapter.itemCount - 1)

                    etInput.setText("")

                    if (isFromMe) {
                        tvStatus.text = "Озвучиваю сербу в динамик..."
                        playAudioToSpeaker(translatedText, "sr")
                    } else {
                        tvStatus.text = "Озвучиваю перевод вам в наушник..."
                        playAudioToEarphone(translatedText, "ru")
                    }
                }
            }

            private suspend fun autoTranslate(text: String, forceToSpeaker: Boolean, forceToEarphone: Boolean): Pair<String, String> = withContext(Dispatchers.IO) {
                try {
                    if (forceToSpeaker) {
                        val tr = translateQuery(text, "ru", "sr")
                        return@withContext Pair("ru", tr.second)
                    }
                    if (forceToEarphone) {
                        val tr = translateQuery(text, "sr", "ru")
                        return@withContext Pair("sr", tr.second)
                    }

                    val first = translateQuery(text, "auto", "sr")
                    val detected = first.first

                    if (detected == "ru") {
                        return@withContext Pair("ru", first.second)
                    } else {
                        val second = translateQuery(text, "sr", "ru")
                        return@withContext Pair("sr", second.second)
                    }
                } catch (e: Exception) {
                    return@withContext translateOffline(text, forceToSpeaker, forceToEarphone)
                }
            }

            private suspend fun translateOffline(text: String, forceToSpeaker: Boolean, forceToEarphone: Boolean): Pair<String, String> {
                return try {
                    if (forceToSpeaker) {
                        val res = ruToOfflineTranslator.translate(text).await()
                        Pair("ru", res)
                    } else if (forceToEarphone) {
                        val res = offlineToRuTranslator.translate(text).await()
                        Pair("sr", res)
                    } else {
                        val isRu = isRussianInput(text)
                        if (isRu) {
                            val res = ruToOfflineTranslator.translate(text).await()
                            Pair("ru", res)
                        } else {
                            val res = offlineToRuTranslator.translate(text).await()
                            Pair("sr", res)
                        }
                    }
                } catch (e: Exception) {
                    Pair("ru", "Офлайн-модель не скачана. Нажмите «📥 Офлайн». (${e.message})")
                }
            }

            private fun isRussianInput(text: String): Boolean {
                val lower = text.lowercase(Locale.getDefault())
                if (lower.any { it in "ыэъё" }) return true
                if (lower.any { it in "јљњћђџ" }) return false
                if (lower.any { it in 'a'..'z' || it in "čćžšđ" }) return false
                return true
            }

            private fun translateQuery(text: String, sl: String, tl: String): Pair<String, String> {
                val encoded = URLEncoder.encode(text, "UTF-8")
                val urlString = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=$sl&tl=$tl&dt=t&q=$encoded"
                val conn = URL(urlString).openConnection() as HttpURLConnection
                conn.requestMethod = "GET"
                conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                conn.connectTimeout = 4000
                conn.readTimeout = 4000

                val resp = conn.inputStream.bufferedReader().use { it.readText() }
                val root = JSONArray(resp)
                val sentences = root.getJSONArray(0)
                val sb = StringBuilder()
                for (i in 0 until sentences.length()) {
                    val row = sentences.optJSONArray(i)
                    if (row != null && row.length() > 0) {
                        val part = row.optString(0)
                        if (part != null) sb.append(part)
                    }
                }

                val detected = root.optString(2, "sr")
                return Pair(detected, sb.toString())
            }

            private fun playAudioToSpeaker(text: String, lang: String) {
                if (!isTtsReady) return
                val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                audioManager.mode = AudioManager.MODE_IN_COMMUNICATION
                audioManager.isSpeakerphoneOn = true

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    val speaker = audioManager.availableCommunicationDevices.firstOrNull {
                        it.type == AudioDeviceInfo.TYPE_BUILTIN_SPEAKER
                    }
                    if (speaker != null) {
                        audioManager.setCommunicationDevice(speaker)
                    }
                }

                val audioAttributes = AudioAttributes.Builder()
                    .setUsage(AudioAttributes.USAGE_VOICE_COMMUNICATION)
                    .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                    .build()
                tts?.setAudioAttributes(audioAttributes)

                val params = Bundle().apply {
                    putInt("streamType", AudioManager.STREAM_VOICE_CALL)
                }

                tts?.language = Locale("sr", "RS")
                tts?.speak(text, TextToSpeech.QUEUE_FLUSH, params, "UTTERANCE_SPEAKER")
            }

            private fun playAudioToEarphone(text: String, lang: String) {
                if (!isTtsReady) return
                val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager

                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    audioManager.clearCommunicationDevice()
                }
                audioManager.isSpeakerphoneOn = false
                audioManager.mode = AudioManager.MODE_NORMAL

                val audioAttributes = AudioAttributes.Builder()
                    .setUsage(AudioAttributes.USAGE_MEDIA)
                    .setContentType(AudioAttributes.CONTENT_TYPE_SPEECH)
                    .build()
                tts?.setAudioAttributes(audioAttributes)

                tts?.language = Locale("ru", "RU")
                tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "UTTERANCE_EARPHONE")
            }

            private fun resetAudioRouting() {
                val audioManager = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                    audioManager.clearCommunicationDevice()
                }
                audioManager.isSpeakerphoneOn = false
                audioManager.mode = AudioManager.MODE_NORMAL
            }

            override fun onDestroy() {
                stopRecording()
                speechRecognizer?.destroy()
                tts?.stop()
                tts?.shutdown()
                ruToOfflineTranslator.close()
                offlineToRuTranslator.close()
                resetAudioRouting()
                super.onDestroy()
            }
        }
