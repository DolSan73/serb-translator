                    }
                }
            }

            private fun addAndPlayDirect(original: String, translated: String, toSpeaker: Boolean) {
                val time = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date())
                val sender = if (toSpeaker) "Вы" else "Серб"
                val msg = MessageModel(
                    sender = sender,
                    originalText = original,
                    translatedText = translated,
                    time = time,
                    isFromSerb = !toSpeaker
                )
                adapter.addMessage(msg)
                rvMessages.smoothScrollToPosition(adapter.itemCount - 1)

                if (toSpeaker) {
                    tvStatus.text = "Озвучиваю сербу в динамик..."
                    playAudioToSpeaker(translated, "sr")
                } else {
                    tvStatus.text = "Озвучиваю в наушник..."
                    playAudioToEarphone(translated, "ru")
                }
            }

            private fun replayMessage(item: MessageModel) {
                vibrateShort()
                if (item.isFromSerb) {
                    tvStatus.text = "Повтор в наушник: ${item.translatedText}"
                    playAudioToEarphone(item.translatedText, "ru")
                } else {
                    tvStatus.text = "Повтор в динамик: ${item.translatedText}"
                    playAudioToSpeaker(item.translatedText, "sr")
                }
            }

            private fun showFullscreenMessage(item: MessageModel) {
                vibrateShort()
                val dialog = Dialog(this, android.R.style.Theme_Black_NoTitleBar_Fullscreen)
                val layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    setBackgroundColor(android.graphics.Color.parseColor("#0D47A1"))
                    setPadding(32, 48, 32, 48)
                    gravity = Gravity.CENTER
                }

                val tvSerb = TextView(this).apply {
                    val serbText = if (item.isFromSerb) item.originalText else item.translatedText
                    text = serbText
                    textSize = 34f
                    setTextColor(android.graphics.Color.WHITE)
                    gravity = Gravity.CENTER
                    setTypeface(null, android.graphics.Typeface.BOLD)
                }

                val tvRu = TextView(this).apply {
                    val ruText = if (item.isFromSerb) item.translatedText else item.originalText
                    text = "($ruText)"
                    textSize = 18f
                    setTextColor(android.graphics.Color.parseColor("#BBDEFB"))
                    gravity = Gravity.CENTER
                    setPadding(0, 24, 0, 36)
                }

                val btnSpeak = Button(this).apply {
                    text = "🔊 Озвучить еще раз"
                    textSize = 16f
                    setBackgroundColor(android.graphics.Color.parseColor("#1565C0"))
                    setTextColor(android.graphics.Color.WHITE)
                    setOnClickListener {
                        val serbText = if (item.isFromSerb) item.originalText else item.translatedText
                        playAudioToSpeaker(serbText, "sr")
                    }
                }

                val btnClose = Button(this).apply {
                    text = "✕ Закрыть"
                    textSize = 16f
                    setBackgroundColor(android.graphics.Color.parseColor("#D32F2F"))
                    setTextColor(android.graphics.Color.WHITE)
