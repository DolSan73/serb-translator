        cat > app/src/main/java/com/translator/serbia/MessageAdapter.kt << 'EOF'
        package com.translator.serbia

        import android.graphics.Color
        import android.view.LayoutInflater
        import android.view.View
        import android.view.ViewGroup
        import android.widget.Button
        import android.widget.TextView
        import androidx.recyclerview.widget.RecyclerView

        class MessageAdapter(
            private val messages: MutableList<MessageModel>,
            private val onReplay: (MessageModel) -> Unit,
            private val onFullscreen: (MessageModel) -> Unit
        ) : RecyclerView.Adapter<MessageAdapter.ViewHolder>() {

            class ViewHolder(view: View) : RecyclerView.ViewHolder(view) {
                val cardLayout: View = view.findViewById(R.id.cardLayout)
                val tvSender: TextView = view.findViewById(R.id.tvSender)
                val tvTime: TextView = view.findViewById(R.id.tvTime)
                val tvOriginal: TextView = view.findViewById(R.id.tvOriginal)
                val tvTranslated: TextView = view.findViewById(R.id.tvTranslated)
                val btnReplay: Button = view.findViewById(R.id.btnReplay)
                val btnFullscreen: Button = view.findViewById(R.id.btnFullscreen)
            }

            override fun onCreateViewHolder(parent: ViewGroup, viewType: Int): ViewHolder {
                val view = LayoutInflater.from(parent.context).inflate(R.layout.item_message, parent, false)
                return ViewHolder(view)
            }

            override fun onBindViewHolder(holder: ViewHolder, position: Int) {
                val item = messages[position]
                holder.tvSender.text = item.sender
                holder.tvTime.text = item.time
                holder.tvOriginal.text = "Оригинал: ${item.originalText}"
                holder.tvTranslated.text = "Перевод: ${item.translatedText}"

                if (item.isFromSerb) {
                    holder.cardLayout.setBackgroundColor(Color.parseColor("#E8F5E9"))
                    holder.tvSender.setTextColor(Color.parseColor("#2E7D32"))
                } else {
                    holder.cardLayout.setBackgroundColor(Color.parseColor("#E3F2FD"))
                    holder.tvSender.setTextColor(Color.parseColor("#1565C0"))
                }

                holder.btnReplay.setOnClickListener {
                    onReplay(item)
                }

                holder.btnFullscreen.setOnClickListener {
                    onFullscreen(item)
                }
            }

            override fun getItemCount() = messages.size

            fun addMessage(msg: MessageModel) {
                messages.add(msg)
                notifyItemInserted(messages.size - 1)
            }

            fun clearAll() {
                val count = messages.size
                messages.clear()
                notifyItemRangeRemoved(0, count)
            }

            fun getAllMessages(): List<MessageModel> = messages

            fun getAllText(): String {
                val sb = StringBuilder()
                for (m in messages) {
                    sb.append("[${m.time}] ${m.sender}:\n")
                    sb.append("Оригинал: ${m.originalText}\n")
                    sb.append("Перевод: ${m.translatedText}\n\n")
                }
                return sb.toString()
            }
        }
        EOF

